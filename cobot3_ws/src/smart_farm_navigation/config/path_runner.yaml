path_runner:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    odom_topic: /chassis/odom
    auto_start: false                 # path.launch.py auto_start:=true 로 켠다

    # ---- smartfarm_v1.usd (2026-09-19 커밋본) 기하 ----
    # 랙 4개: Rack_01/02 x=-1.0, Rack_03/04 x=+1.0, 각 0.56(x) x 1.0(y) m, y -0.55..+1.48 -> 통로 안쪽 폭 1.44 m
    # 컨베이어(정육면체 1 m): 중심 (-2.44, 6.82), 앞면 y=6.32
    # 가정: 로봇은 원점에서 보이는 정면이 +y(통로 방향)인 상태로 시작. 커밋된 USD 에는 carter/cube 가 없어 확인 필요.
    #
    # 경유지는 시작 기준 좌표계: X = 시작 시 보이는 정면 방향, Y = 왼쪽. 단위 m.
    #   1) (3.0, 0.0)  통로를 완전히 빠져나온 지점 (랙 끝 1.48 + 차체 후단 0.61 + 여유)
    #   2) (3.0, 2.44) 왼쪽으로 이동해 컨베이어 정면 라인에 정렬
    #   3) (5.4, 2.44) 컨베이어 앞면(y 6.32)에서 0.3 m 앞. 보이는 정면 길이 0.61 m 반영
    waypoints_x: [3.0, 3.0, 5.4]
    waypoints_y: [0.0, 2.44, 2.44]
    final_heading_deg: 0.0            # 시작 방향과 동일 (통로를 빠져나올 때의 방향)

    drive_direction_sign: -1.0        # 이 carter 는 linear.x < 0 이 보이는 정면 방향
    drive_speed_mps: 0.4
    drive_min_speed_mps: 0.08
    slow_zone_m: 0.5                  # 경유지 0.5 m 전부터 감속
    turn_speed_radps: 0.5
    turn_min_speed_radps: 0.1
    turn_gain: 1.5
    heading_tolerance_deg: 2.0
    waypoint_tolerance_m: 0.05

    heading_hold_gain: 1.0
    heading_hold_max_radps: 0.3
    cross_track_gain: 1.5
    cross_track_max_angle_rad: 0.7
    max_cross_track_m: 0.6            # 통로 여유 0.47 m 를 넘기 전에 중단 (랙 충돌 방지)

    settle_duration_s: 0.5
    odom_timeout_s: 1.0
    phase_timeout_factor: 10.0
    phase_timeout_min_s: 30.0
    stall_timeout_s: 4.0
    stall_min_progress: 0.01
    stop_hold_duration_s: 1.0
