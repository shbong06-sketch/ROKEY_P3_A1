path_runner:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    odom_topic: /chassis/odom
    auto_start: false                 # path.launch.py auto_start:=true 로 켠다

    # ---- Collected_smartfarm_v004.usd: 직선-제자리회전 버전 (곡선 주행은 path_runner_smooth.yaml, 값 근거도 그 파일 참고) ----
    #   (1.5, 0.0) 통로 탈출점 -> (1.5, 3.728) 왼쪽 이동 -> (4.821, 3.728) INSPECTION_DOCK (Seg_6 가운데 앞)
    waypoints_x: [1.5, 1.5, 4.821]
    waypoints_y: [0.0, 3.728, 3.728]
    final_heading_deg: 0.0            # 시작 방향과 동일 (통로를 빠져나올 때의 방향)

    drive_direction_sign: -1.0        # 카터가 바라보는 정면 = base_link -x (path_runner_smooth.yaml 과 동일)
    drive_speed_mps: 0.4
    drive_min_speed_mps: 0.08
    slow_zone_m: 0.5                  # 경유지 0.5 m 전부터 감속
    turn_speed_radps: 0.5
    turn_min_speed_radps: 0.1
    turn_gain: 1.5
    heading_tolerance_deg: 2.0
    waypoint_tolerance_m: 0.05

    heading_hold_gain: 1.0
    heading_hold_max_radps: 0.3
    cross_track_gain: 1.5
    cross_track_max_angle_rad: 0.7
    max_cross_track_m: 0.6            # 통로 여유 0.47 m 를 넘기 전에 중단 (랙 충돌 방지)

    settle_duration_s: 0.5
    odom_timeout_s: 1.0
    phase_timeout_factor: 10.0
    phase_timeout_min_s: 30.0
    stall_timeout_s: 4.0
    stall_min_progress: 0.01
    stop_hold_duration_s: 1.0
