color_detector:
  ros__parameters:
    # OpenCV HSV: H=0..179, S/V=0..255
    green_hsv_lower: [40, 80, 50]
    green_hsv_upper: [85, 255, 255]
    blue_hsv_lower: [100, 80, 50]
    blue_hsv_upper: [130, 255, 255]

    # Normalized image coordinates
    roi_x: 0.30
    roi_y: 0.30
    roi_width: 0.40
    roi_height: 0.40

    min_area: 500.0
    stable_frames: 5
    image_timeout_sec: 0.5
    publish_rate_hz: 10.0
    morph_kernel_size: 5
