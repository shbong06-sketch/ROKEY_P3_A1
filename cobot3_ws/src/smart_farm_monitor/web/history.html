<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스마트팜 관제 — 사이클 이력</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>스마트팜 관제</h1>
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <span id="link-state" class="link-state">연결 준비</span>
</header>

<main>
  <div class="grid cols-2" style="margin-bottom:14px">
    <div class="panel">
      <h2>사이클 목록 (행을 누르면 아래가 바뀜)</h2>
      <div id="cycle-table"></div>
    </div>
    <div class="panel">
      <h2>operation 별 시뮬레이션 소요시간</h2>
      <div id="duration-table"></div>
      <p class="note"><code>late_result</code> 행은 제외한 통계임. 이 값이 팀 <code>scenario.py</code> 의
      <code>timeout_sec</code> 을 <code>/clock</code> 기준으로 다시 잡을 근거임.</p>
    </div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <h2 id="gantt-title">단계별 소요시간</h2>
    <div id="gantt"></div>
  </div>

  <div class="panel">
    <h2>단계 상세 · 정상·이상 라벨</h2>
    <div id="step-table"></div>
    <p class="note">라벨은 <code>anomaly_label</code> 표에 쌓이며 ML 이상 탐지의 학습 입력으로 넘김.</p>
  </div>
</main>

<script src="/static/app.js"></script>
<script>
renderNav('/history');

let selectedTask = '';

async function loadCycles() {
  const data = await getJson('/api/cycles?limit=50');
  const rows = data.cycles || [];
  if (!rows.length) {
    document.getElementById('cycle-table').innerHTML =
      '<div class="empty">사이클 기록이 아직 없음</div>';
    return;
  }
  if (!selectedTask) selectedTask = rows[0].task_id;

  document.getElementById('cycle-table').innerHTML = `<table>
    <thead><tr><th>task_id</th><th>결과</th><th class="num">sim 소요</th>
    <th class="num">벽시계 소요</th><th>시작</th><th>사유</th></tr></thead>
    <tbody>${rows.map((row) => {
      const sim = row.ended_sim !== null && row.started_sim !== null
        ? row.ended_sim - row.started_sim : null;
      const wall = row.ended_wall !== null && row.started_wall !== null
        ? row.ended_wall - row.started_wall : null;
      return `<tr data-task="${row.task_id}" class="${row.task_id === selectedTask ? 'sel' : ''}">
        <td class="mono">${row.task_id}</td>
        <td>${tag(row.terminal_status)}</td>
        <td class="num">${seconds(sim)}</td>
        <td class="num">${seconds(wall)}</td>
        <td>${wallTime(row.started_wall)}</td>
        <td>${text(row.failure_reason === 'NONE' ? '' : row.failure_reason)}</td>
      </tr>`;
    }).join('')}</tbody></table>`;

  document.querySelectorAll('#cycle-table tr[data-task]').forEach((element) => {
    element.addEventListener('click', () => {
      selectedTask = element.dataset.task;
      loadCycles();
      loadDetail();
    });
  });
}

async function loadDurations() {
  const data = await getJson('/api/step-durations');
  const rows = data.durations || [];
  if (!rows.length) {
    document.getElementById('duration-table').innerHTML =
      '<div class="empty">완료된 단계가 아직 없음</div>';
    return;
  }
  document.getElementById('duration-table').innerHTML = `<table>
    <thead><tr><th>operation</th><th class="num">표본</th><th class="num">평균</th>
    <th class="num">최소</th><th class="num">최대</th></tr></thead>
    <tbody>${rows.map((row) => `<tr>
      <td>${row.operation}</td>
      <td class="num">${row.n}</td>
      <td class="num">${seconds(row.avg_sim)}</td>
      <td class="num">${seconds(row.min_sim)}</td>
      <td class="num">${seconds(row.max_sim)}</td>
    </tr>`).join('')}</tbody></table>`;
}

async function loadDetail() {
  if (!selectedTask) return;
  const data = await getJson('/api/cycle/' + encodeURIComponent(selectedTask));
  const steps = data.steps || [];
  document.getElementById('gantt-title').textContent =
    `단계별 소요시간 — ${selectedTask} (sim 기준)`;

  const longest = Math.max(1, ...steps.map((step) => step.duration_sim || 0));
  document.getElementById('gantt').innerHTML = steps.length
    ? steps.map((step) => {
        const width = ((step.duration_sim || 0) / longest) * 100;
        const klass = step.late_result ? 'late' : (step.status === 'FAILED' ? 'failed' : '');
        return `<div class="bar-row">
          <span>${text(step.operation)}${step.late_result ? ' (늦음)' : ''}</span>
          <span><span class="bar ${klass}" style="width:${width.toFixed(1)}%"></span></span>
          <span class="num">${seconds(step.duration_sim)}</span>
        </div>`;
      }).join('')
    : '<div class="empty">이 사이클에 기록된 단계가 없음</div>';

  const labels = {};
  for (const label of data.labels || []) labels[label.command_id] = label.label;

  document.getElementById('step-table').innerHTML = steps.length
    ? `<table>
      <thead><tr><th>#</th><th>executor</th><th>operation</th><th>결과</th>
      <th>phase</th><th>사유</th><th class="num">sim</th><th class="num">벽시계</th>
      <th>라벨</th><th></th></tr></thead>
      <tbody>${steps.map((step) => `<tr>
        <td class="num">${text(step.seq)}</td>
        <td>${text(step.executor)}</td>
        <td>${text(step.operation)}${step.late_result ? ' <span class="tag late">늦음</span>' : ''}</td>
        <td>${tag(step.status)}</td>
        <td>${text(step.phase)}</td>
        <td>${text(step.reason === 'NONE' ? '' : step.reason)}</td>
        <td class="num">${seconds(step.duration_sim)}</td>
        <td class="num">${seconds(step.duration_wall)}</td>
        <td>${labels[step.command_id] ? tag(labels[step.command_id]) : '—'}</td>
        <td>
          <button class="ghost" data-label="NORMAL" data-cmd="${step.command_id}">정상</button>
          <button class="ghost" data-label="ANOMALY" data-cmd="${step.command_id}">이상</button>
        </td>
      </tr>`).join('')}</tbody></table>`
    : '<div class="empty">이 사이클에 기록된 단계가 없음</div>';

  document.querySelectorAll('#step-table button[data-label]').forEach((button) => {
    button.addEventListener('click', async () => {
      await postJson('/api/label', {
        task_id: selectedTask,
        command_id: button.dataset.cmd,
        label: button.dataset.label,
        note: '',
      });
      loadDetail();
    });
  });
}

async function refresh() {
  await loadCycles();
  await loadDurations();
  await loadDetail();
}

refresh();
subscribeState(() => refresh());
</script>
</body>
</html>
