<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스마트팜 관제 — 대시보드</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>스마트팜 관제</h1>
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <span id="link-state" class="link-state">연결 준비</span>
  <button id="start-btn">DEMO_HARVEST_01 시작</button>
</header>

<main>
  <div id="banner-area" class="grid" style="margin-bottom:14px"></div>

  <div class="kpi" id="kpi" style="margin-bottom:14px"></div>

  <div class="grid dash">
    <div class="grid" style="gap:14px">
      <div class="panel">
        <h2>현재 사이클</h2>
        <div class="rows" id="cycle-rows"></div>
      </div>

      <div class="panel">
        <h2>실행 노드 상태</h2>
        <div class="rows" id="executor-rows"></div>
      </div>

      <div class="panel">
        <h2>공정 12단계</h2>
        <div class="steps" id="step-list"></div>
        <p class="note">소요시간은 <b>시뮬레이션 시각(/clock) 기준</b>임. 벽시계 값은 사이클 이력 화면에서 함께 봄.</p>
      </div>

      <div class="panel">
        <h2>최근 도킹</h2>
        <div id="dock-recent"></div>
      </div>
    </div>

    <div class="panel">
      <h2>지도 · 로봇 위치 (map 좌표계)</h2>
      <div class="map-wrap"><canvas id="map-canvas" width="855" height="1380"></canvas></div>
      <div class="rows" id="pose-rows" style="margin-top:10px"></div>
      <p class="note">파란 점이 로봇(<code>/amcl_pose</code>), 선은 <code>base_link</code> +x 방향임. 회색 점은 <code>stations.yaml</code> 의 작업점임.</p>
    </div>
  </div>
</main>

<script src="/static/app.js"></script>
<script>
renderNav('/');

const SCALE = 3;                  // 지도 이미지를 3배로 그려 표식이 보이게 한다
let mapMeta = null;
let mapImage = null;
let lastState = null;

async function setupMap() {
  mapMeta = await getJson('/api/map');
  const canvas = document.getElementById('map-canvas');
  if (!mapMeta.available) {
    canvas.style.display = 'none';
    return;
  }
  canvas.width = mapMeta.width_px * SCALE;
  canvas.height = mapMeta.height_px * SCALE;
  mapImage = new Image();
  mapImage.onload = () => drawMap(lastState);
  mapImage.src = mapMeta.image_url;
}

function drawMap(state) {
  if (!mapMeta || !mapMeta.available || !mapImage) return;
  const canvas = document.getElementById('map-canvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(mapImage, 0, 0, canvas.width, canvas.height);

  // 작업점
  ctx.font = '13px sans-serif';
  for (const station of mapMeta.stations || []) {
    const point = mapToPixel(mapMeta, station.x, station.y);
    const x = point.px * SCALE;
    const y = point.py * SCALE;
    ctx.fillStyle = '#8b97a6';
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#c9d4e0';
    ctx.fillText(station.name, x + 8, y + 4);
  }

  // 로봇
  const pose = state && state.robot_pose;
  if (pose) {
    const point = mapToPixel(mapMeta, pose.x, pose.y);
    const x = point.px * SCALE;
    const y = point.py * SCALE;
    const radians = (pose.yaw_deg * Math.PI) / 180;
    ctx.strokeStyle = '#58a6ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    // 이미지 y 는 아래로 증가하므로 진행 방향의 y 부호를 뒤집는다.
    ctx.lineTo(x + Math.cos(radians) * 26, y - Math.sin(radians) * 26);
    ctx.stroke();
    ctx.fillStyle = '#58a6ff';
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.fill();
  }
}

function renderKpi(kpi) {
  const cards = [
    ['사이클 성공률', percent(kpi.cycle_succeeded, kpi.cycle_total),
      `${kpi.cycle_succeeded} / ${kpi.cycle_total} 회`],
    ['평균 사이클 시간', seconds(kpi.cycle_avg_sim_sec), 'sim 기준'],
    ['도킹 성공률', percent(kpi.dock_succeeded, kpi.dock_total),
      `${kpi.dock_succeeded} / ${kpi.dock_total} 회`],
    ['평균 재시도', kpi.dock_avg_retry === null ? '—' : Number(kpi.dock_avg_retry).toFixed(2),
      'feeder_dock BACKOFF'],
    ['최대 횡 오차', meters(kpi.dock_max_lat_m), '면 접선 방향'],
    ['불량 검출', String(kpi.defect_detections), '노란색·갈색'],
  ];
  document.getElementById('kpi').innerHTML = cards.map(
    ([label, value, sub]) =>
      `<div class="card"><div class="label">${label}</div>
       <div class="value">${value}</div><div class="sub">${sub}</div></div>`
  ).join('');
}

function renderCycle(state) {
  const live = state.cycle_live || {};
  const cycle = state.cycle;
  const startedSim = cycle && cycle.started_sim;
  const lastSim = lastStepSim(state.steps);
  const elapsedSim = startedSim !== null && startedSim !== undefined && lastSim !== null
    ? lastSim - startedSim : null;

  const lines = [
    ['task_id', `<span class="mono">${text(live.task_id || (cycle && cycle.task_id))}</span>`],
    ['시나리오', text(live.scenario_id || (cycle && cycle.scenario_id))],
    ['현재 단계', tag(live.state || (cycle && cycle.final_state))],
    ['사이클 상태', tag(live.status || (cycle && cycle.terminal_status))],
    ['실패 사유', text(live.reason === 'NONE' ? '' : live.reason)],
    ['진행 중 명령', `<span class="mono">${text(live.active_command_id)}</span>`],
    ['경과 (sim)', seconds(elapsedSim)],
    ['시작 시각 (벽시계)', wallTime(cycle && cycle.started_wall)],
  ];
  document.getElementById('cycle-rows').innerHTML = lines.map(
    ([k, v]) => `<div class="row-line"><span class="k">${k}</span><span>${v}</span></div>`
  ).join('');
}

function lastStepSim(steps) {
  let value = null;
  for (const step of steps || []) {
    for (const candidate of [step.issued_sim, step.result_sim]) {
      if (candidate !== null && candidate !== undefined) {
        value = value === null ? candidate : Math.max(value, candidate);
      }
    }
  }
  return value;
}

function renderExecutors(state) {
  const wanted = ['sim_task', 'navigation', 'inspection', 'sim_task_data'];
  const byName = {};
  for (const row of state.executors || []) byName[row.executor] = row;

  document.getElementById('executor-rows').innerHTML = wanted.map((name) => {
    const row = byName[name];
    const stateName = row ? text(row.state, 'none') : 'none';
    const detail = row ? text(row.phase) + ' · ' + text(row.detail) : '수신 없음';
    return `<div class="row-line">
      <span><span class="lamp ${stateName}"></span>${name}</span>
      <span style="max-width:60%;text-align:right;color:var(--muted)">${stateName} — ${detail}</span>
    </div>`;
  }).join('');
}

function renderSteps(state) {
  const order = state.step_order || [];
  const byOperation = {};
  for (const step of state.steps || []) {
    if (step.late_result) continue;
    byOperation[step.operation] = step;
  }
  const active = (state.cycle_live || {}).state;

  document.getElementById('step-list').innerHTML = order.map((operation, index) => {
    const step = byOperation[operation];
    let klass = 'todo';
    let mark = '·';
    if (step && step.status === 'SUCCEEDED') { klass = 'done'; mark = '✓'; }
    else if (step && step.status === 'FAILED') { klass = 'failed'; mark = '✕'; }
    else if (operation === active) { klass = 'active'; mark = '▶'; }
    return `<div class="step ${klass}">
      <span class="mark">${mark}</span>
      <span>${operation}</span>
      <span class="num">${step ? seconds(step.duration_sim) : ''}</span>
      <span class="num">${index + 1} / ${order.length}</span>
    </div>`;
  }).join('');
}

function renderDockRecent(state) {
  const rows = state.dock_recent || [];
  if (!rows.length) {
    document.getElementById('dock-recent').innerHTML =
      '<div class="empty">도킹 기록이 아직 없음</div>';
    return;
  }
  document.getElementById('dock-recent').innerHTML = `<table>
    <thead><tr><th>run_id</th><th>결과</th><th class="num">면 거리</th>
    <th class="num">yaw 오차</th><th class="num">횡 오차</th><th class="num">재시도</th></tr></thead>
    <tbody>${rows.map((row) => `<tr>
      <td class="mono">${text(row.run_id)}</td>
      <td>${tag(row.status)}</td>
      <td class="num">${meters(row.face_dist_m, 3)}</td>
      <td class="num">${degrees(row.yaw_err_deg)}</td>
      <td class="num">${meters(row.lat_m, 3)}</td>
      <td class="num">${text(row.retry)}</td>
    </tr>`).join('')}</tbody></table>`;
}

function renderPose(state) {
  const pose = state.robot_pose;
  const lines = pose ? [
    ['x (map)', meters(pose.x, 3)],
    ['y (map)', meters(pose.y, 3)],
    ['yaw (map)', degrees(pose.yaw_deg)],
    ['갱신', wallTime(pose.updated_wall)],
  ] : [['자세', '<code>/amcl_pose</code> 수신 없음']];
  document.getElementById('pose-rows').innerHTML = lines.map(
    ([k, v]) => `<div class="row-line"><span class="k">${k}</span><span>${v}</span></div>`
  ).join('');
}

function renderBanner(state) {
  const messages = [];
  const live = state.cycle_live || {};
  if (live.state === 'ERROR' || live.status === 'FAILED') {
    messages.push(['bad', `사이클 실패 — 사유 <b>${text(live.reason)}</b>`]);
  }
  const late = (state.steps || []).filter((step) => step.late_result);
  if (late.length) {
    messages.push(['warn',
      `제한시간 초과로 실패 처리된 뒤 늦게 도착한 결과 ${late.length} 건 — ` +
      `Isaac 동작은 계속 돌고 있었음. <code>timeout_sec</code> 재검토 대상임`]);
  }
  const errorNode = (state.executors || []).find((row) => row.state === 'ERROR');
  if (errorNode) {
    messages.push(['bad', `${errorNode.executor} 가 ERROR 상태 — ${text(errorNode.detail)}`]);
  }
  document.getElementById('banner-area').innerHTML = messages.map(
    ([kind, html]) => `<div class="banner ${kind}">${html}</div>`
  ).join('');
}

function render(state) {
  lastState = state;
  renderBanner(state);
  renderKpi(state.kpi || {});
  renderCycle(state);
  renderExecutors(state);
  renderSteps(state);
  renderDockRecent(state);
  renderPose(state);
  drawMap(state);
}

document.getElementById('start-btn').addEventListener('click', async (event) => {
  const button = event.currentTarget;
  button.disabled = true;
  button.textContent = '요청 중…';
  try {
    const queued = await postJson('/api/start_cycle', { scenario_id: 'DEMO_HARVEST_01' });
    const result = await waitForCommand(queued.queued_id);
    const answer = result.response ? JSON.parse(result.response) : {};
    button.textContent = result.state === 'ACCEPTED'
      ? '수락됨 — 진행 중'
      : `거절: ${text(answer.reason, result.state)}`;
  } catch (error) {
    button.textContent = '요청 실패';
    console.error(error);
  }
  setTimeout(() => {
    button.disabled = false;
    button.textContent = 'DEMO_HARVEST_01 시작';
  }, 4000);
});

async function waitForCommand(rowId) {
  for (let attempt = 0; attempt < 20; attempt += 1) {
    const row = await getJson('/api/web_command/' + rowId);
    if (row.state !== 'PENDING' && row.state !== 'SENT') return row;
    await new Promise((resolve) => setTimeout(resolve, 400));
  }
  return { state: 'SENT', response: null };
}

setupMap().then(() => subscribeState(render));
</script>
</body>
</html>
