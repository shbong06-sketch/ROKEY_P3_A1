<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스마트팜 관제 — 검사 결과</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>스마트팜 관제</h1>
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <span id="link-state" class="link-state">연결 준비</span>
</header>

<main>
  <div class="panel" style="margin-bottom:14px">
    <h2 id="slot-title">슬롯별 검사 결과</h2>
    <div class="grid cols-6" id="slot-grid"></div>
    <p class="note">붉은 테두리 = 불량 슬롯, 노란 테두리 = 미판정 슬롯. 검사(1차)와 재검사(2차)를 나눠 표시함.</p>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <h2>검사 판정 기록</h2>
    <div id="verdict-table"></div>
  </div>

  <div class="panel">
    <h2>검출 좌표 (원본 RGB 영상 pixel · u=가로, v=세로)</h2>
    <div id="detection-table"></div>
  </div>
</main>

<script src="/static/app.js"></script>
<script>
renderNav('/inspection');

const SLOTS = ['SLOT_01', 'SLOT_02', 'SLOT_03', 'SLOT_04', 'SLOT_05', 'SLOT_06'];

function isDefect(className, hints) {
  const lowered = String(className || '').toLowerCase();
  return hints.some((hint) => lowered.includes(hint));
}

async function refresh() {
  const data = await getJson('/api/detections');
  const detections = data.detections || [];
  const verdicts = data.verdicts || [];
  const hints = data.defect_hints || [];

  document.getElementById('slot-title').textContent =
    `슬롯별 검사 결과 — ${text(data.task_id, '사이클 없음')}`;

  // 마지막 판정의 불량·미판정 슬롯
  const defectSet = new Set();
  const unknownSet = new Set();
  if (verdicts.length) {
    const last = verdicts[verdicts.length - 1];
    for (const slot of JSON.parse(last.defect_slots || '[]')) defectSet.add(slot);
    for (const slot of JSON.parse(last.unknown_slots || '[]')) unknownSet.add(slot);
  }

  // 슬롯별로 pass 가 큰(가장 최근) 검출을 고른다
  const bySlot = {};
  for (const row of detections) {
    if (!row.slot_id) continue;
    const kept = bySlot[row.slot_id];
    if (!kept || row.pass_no > kept.pass_no || row.id > kept.id) bySlot[row.slot_id] = row;
  }

  document.getElementById('slot-grid').innerHTML = SLOTS.map((slot) => {
    const row = bySlot[slot];
    let klass = '';
    if (defectSet.has(slot)) klass = 'defect';
    else if (unknownSet.has(slot)) klass = 'unknown';
    else if (row && isDefect(row.class_name, hints)) klass = 'defect';
    return `<div class="slot ${klass}">
      <div class="name">${slot}${row ? ` · ${row.pass_no}차` : ''}</div>
      <div class="cls">${row ? text(row.class_name) : '검출 없음'}</div>
      <div class="conf">${row && row.confidence !== null
        ? 'conf ' + Number(row.confidence).toFixed(2) : ''}</div>
    </div>`;
  }).join('');

  document.getElementById('verdict-table').innerHTML = verdicts.length
    ? `<table><thead><tr><th>command_id</th><th>operation</th><th>팔레트</th>
       <th>불량 슬롯</th><th>미판정 슬롯</th><th>수신</th></tr></thead>
       <tbody>${verdicts.map((row) => `<tr>
         <td class="mono">${text(row.command_id)}</td>
         <td>${text(row.operation)}</td>
         <td>${text(row.pallet_id)}</td>
         <td>${text(JSON.parse(row.defect_slots || '[]').join(', '))}</td>
         <td>${text(JSON.parse(row.unknown_slots || '[]').join(', '))}</td>
         <td>${wallTime(row.recv_wall)}</td>
       </tr>`).join('')}</tbody></table>`
    : '<div class="empty">검사 판정 기록이 아직 없음</div>';

  document.getElementById('detection-table').innerHTML = detections.length
    ? `<table><thead><tr><th>차수</th><th>슬롯</th><th>클래스</th><th class="num">conf</th>
       <th class="num">center_u</th><th class="num">center_v</th>
       <th class="num">bbox x</th><th class="num">bbox y</th><th class="num">영상 크기</th></tr></thead>
       <tbody>${detections.map((row) => `<tr>
         <td class="num">${row.pass_no}</td>
         <td>${text(row.slot_id, '(미배정)')}</td>
         <td>${text(row.class_name)}</td>
         <td class="num">${row.confidence === null ? '—' : Number(row.confidence).toFixed(2)}</td>
         <td class="num">${text(row.center_u)}</td>
         <td class="num">${text(row.center_v)}</td>
         <td class="num">${text(row.bbox_x_min)}–${text(row.bbox_x_max)}</td>
         <td class="num">${text(row.bbox_y_min)}–${text(row.bbox_y_max)}</td>
         <td class="num">${text(row.image_width)}×${text(row.image_height)}</td>
       </tr>`).join('')}</tbody></table>`
    : '<div class="empty">검출 기록이 아직 없음</div>';
}

refresh();
subscribeState(() => refresh());
</script>
</body>
</html>
